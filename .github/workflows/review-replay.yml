name: Replay automated review

# Maintainers start this by hand to measure a reviewer change on recorded pull request snapshots before its switch is
# turned on. It posts nothing: no comment, no review, no status. It runs only the default branch's reviewer, because
# the job holds the LLM key; a reviewer change must reach the default branch behind a switch before it is measured.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: Pull request numbers to replay, comma-separated. Empty replays every case.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-replay
  cancel-in-progress: false

jobs:
  replay:
    name: Replay review cases
    # Repo-global LLM kill switch, and only reviewed default-branch code may receive the LLM key.
    if: ${{ (vars.LLM_ENABLED == '1' || vars.LLM_ENABLED == 'true') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    # Every case runs the review twice, each with the review's own 30-minute analysis budget.
    timeout-minutes: 350
    steps:
      - name: Check out the default-branch reviewer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Replay
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_REVIEW_IDLE_SECONDS: ${{ vars.LLM_REVIEW_IDLE_SECONDS }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          REPLAY_CASES: ${{ inputs.cases }}
          REPLAY_OUTPUT: ${{ runner.temp }}/review-replay
          # Stop starting reviews early enough to write the results before the job timeout.
          REPLAY_BUDGET_SECONDS: "18000"
        run: python3 .github/scripts/replay_review.py

      - name: Keep the replay result
        # Also after a cancellation, so the cases finished so far survive.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-replay
          path: ${{ runner.temp }}/review-replay
          if-no-files-found: warn
          retention-days: 30
