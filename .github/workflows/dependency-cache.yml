name: Verify hosted macOS upgrade probes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  upgrade:
    name: Test twelve macOS upgrade points
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out the upload-free rehearsal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          executable="$(bash scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-install")"
          dirname "$executable" >> "$GITHUB_PATH"
          "$executable" --version

      - name: Test compile controls and metadata checks
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          python3 -B .github/scripts/test_upgrade_metal.py
          python3 -B .github/scripts/test_upgrade_metadata.py

      - name: Test installed upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/test-release-upgrade.sh --target HEAD --release-tag v1.1.0-beta.3 \
            --sources v1.0.5 --platform macOS --points backup.claimed --working-copy 2>&1 | tee "$RUNNER_TEMP/release-upgrade.log"

      - name: Print retained journey evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path.home() / 'Developer/xcode/EncryptedMemories/UpgradeCheck/evidence'
          for path in sorted(root.rglob('*.json')):
              if path.name in {'toolchain.json', 'build-metadata.json', 'old-bundle.json', 'new-bundle.json', 'backup-consent.json'}:
                  print(str(path.relative_to(root)), path.read_text(), flush=True)
          for path in sorted(root.rglob('*-ui.log')):
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if 'error:' in line or 'failed' in line.lower()]
              if errors:
                  print(str(path.relative_to(root)), '\n'.join(errors[-30:]), flush=True)
          PYTHON

      - name: Check the synthetic failure evidence before upload
        if: failure() && github.ref == 'refs/heads/work/upgrade-macos-metal-hosted' && runner.os == 'macOS'
        run: |
          python3 - <<'PYTHON'
          import re
          import shutil
          import subprocess
          from pathlib import Path
          root = Path.home() / 'Developer/xcode/EncryptedMemories/UpgradeCheck/evidence'
          cases = list(root.glob('*/macOS/v1.0.5/backup.claimed'))
          if len(cases) != 1:
              raise SystemExit('Expected one owned backup.claimed failure directory')
          case = cases[0]
          files = [case / 'prepare-ui.log', case / 'prepare.xcresult']
          if not files[0].is_file() or not files[1].is_dir():
              raise SystemExit('The preparation log or result bundle is missing')
          result = subprocess.check_output([
              'xcrun', 'xcresulttool', 'get', 'object', '--legacy',
              '--path', str(files[1]), '--format', 'json'])
          forbidden = re.compile(
              rb'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'
              rb'|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
              rb'|/Users/(?!runner/)[^/\s"]+'
              rb'|[A-Za-z0-9._%+-]+@(?!example\.invalid|ui-test\.invalid)[A-Za-z0-9.-]+\.[A-Za-z]{2,}',
              re.IGNORECASE)
          payloads = [result, files[0].read_bytes()]
          payloads.extend(p.read_bytes() for p in files[1].rglob('*') if p.is_file())
          if any(forbidden.search(payload) for payload in payloads):
              raise SystemExit('Failure evidence rejected: credential, personal email, or non-runner user path')
          destination = Path('hosted-macos-failure-evidence')
          destination.mkdir()
          shutil.copy2(files[0], destination / files[0].name)
          shutil.copytree(files[1], destination / files[1].name)
          print('Synthetic fixture only; credential, personal-email and user-path checks passed.')
          PYTHON

      - name: Retain the checked macOS preparation failure
        if: failure() && github.ref == 'refs/heads/work/upgrade-macos-metal-hosted' && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-macos-backup-claimed-failure
          path: hosted-macos-failure-evidence/
          if-no-files-found: error
          retention-days: 3
