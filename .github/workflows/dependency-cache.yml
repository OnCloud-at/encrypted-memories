name: Verify hosted macOS upgrade probes

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  upgrade:
    name: Diagnose hosted macOS Settings toolbar
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out the upload-free rehearsal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'

      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          executable="$(bash scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen-install")"
          dirname "$executable" >> "$GITHUB_PATH"
          "$executable" --version

      - name: Test compile controls and metadata checks
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          python3 -B .github/scripts/test_upgrade_metal.py
          python3 -B .github/scripts/test_upgrade_metadata.py
          python3 -B .github/scripts/test_upgrade_journey.py UpgradeJourneyTests.test_native_macos_settings_pane_retries_only_unacknowledged_clicks

      - name: Test installed upgrades
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/test-release-upgrade.sh --target HEAD --release-tag v1.1.0-beta.3 \
            --sources v1.0.5 --platform macOS --working-copy 2>&1 | tee "$RUNNER_TEMP/release-upgrade.log"

      - name: Print retained journey evidence
        if: always()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path.home() / 'Developer/xcode/EncryptedMemories/UpgradeCheck/evidence'
          for path in sorted(root.rglob('*.json')):
              if path.name in {'toolchain.json', 'build-metadata.json', 'old-bundle.json', 'new-bundle.json', 'backup-consent.json'}:
                  print(str(path.relative_to(root)), path.read_text(), flush=True)
          for path in sorted(root.rglob('*-ui.log')):
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if 'error:' in line or 'failed' in line.lower()]
              if errors:
                  print(str(path.relative_to(root)), '\n'.join(errors[-30:]), flush=True)
          PYTHON


      - name: Print the checked Settings diagnostic subtrees
        if: always() && github.ref == 'refs/heads/work/upgrade-macos-metal-hosted' && runner.os == 'macOS'
        run: |
          python3 - <<'PYTHON'
          import json
          import re
          import subprocess
          from pathlib import Path

          forbidden = re.compile(
              rb'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'
              rb'|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'
              rb'|/Users/(?!runner(?:/|[\s\x22\x27]|$))[^/\s"]+'
              rb'|[A-Za-z0-9._%+-]+@(?!example\.invalid|ui-test\.invalid)[A-Za-z0-9.-]+\.[A-Za-z]{2,}',
              re.IGNORECASE)


          def settings_subtree(hierarchy):
              elements = []
              for line in hierarchy.splitlines():
                  element = re.match(r'^(\s*)([A-Za-z][A-Za-z ]*)(?: \([^)]*\))?, ', line)
                  if not element:
                      continue
                  attributes = {}
                  content = line.split(' <AX ', 1)[0].split(' <App ', 1)[0]
                  for field in re.finditer(r"\b(identifier|title|label|value):\s*(?:'([^']*)'|([^,]*))", content):
                      attributes[field[1]] = (field[2] if field[2] is not None else field[3]).strip()
                  elements.append((len(element[1]), element[2], attributes))
              starts = [index for index, (_, role, attributes) in enumerate(elements)
                        if role == 'Window' and 'Settings' in [attributes.get(key) for key in ('identifier', 'title', 'label')]]
              if len(starts) != 1:
                  raise ValueError('Expected one Settings window in the failure hierarchy')
              start = starts[0]
              depth = elements[start][0]
              result = []
              for index, (indent, role, attributes) in enumerate(elements[start:], start):
                  if index > start and indent <= depth:
                      break
                  entry = {'role': role[:60], 'identifier': attributes.get('identifier', '')[:60],
                           'title': attributes.get('title', attributes.get('label', ''))[:60],
                           'value': attributes.get('value', '')[:60]}
                  result.append(' ' * (indent - depth) + json.dumps(entry, ensure_ascii=False))
              return '\n'.join(result)


          def rejection_category(text):
              match = forbidden.search(text.encode())
              if match is None:
                  return None
              value = match.group().lower()
              if value.startswith(b'/users/'):
                  return 'non-runner user path'
              if value.startswith(b'-----begin'):
                  return 'private key'
              if value.startswith((b'ghp_', b'gho_', b'ghu_', b'ghs_', b'ghr_', b'github_pat_')):
                  return 'credential'
              return 'personal email'


          def main():
              root = Path.home() / 'Developer/xcode/EncryptedMemories/UpgradeCheck/evidence'
              cases = list(root.glob('*/macOS/v1.0.5/backup.claimed/prepare.xcresult'))
              if len(cases) != 1:
                  raise SystemExit('Expected one owned backup.claimed preparation result')
              log_path = cases[0].parent / 'prepare-ui.log'
              diagnostic_lines = [line.split('SETTINGS_DIAGNOSTIC ', 1)[1]
                                  for path in sorted(root.rglob('*-ui.log'))
                                  for line in path.read_text().splitlines() if 'SETTINGS_DIAGNOSTIC ' in line]
              if not diagnostic_lines:
                  raise SystemExit('The preparation produced no Settings diagnostic facts')
              print('::group::Checked Settings strategy and frame facts')
              for text in diagnostic_lines:
                  category = rejection_category(text)
                  if category:
                      print('Rejected diagnostic facts: file=prepare-ui.log; category=' + category)
                      print('Data-check pattern: ' + forbidden.pattern.decode())
                      raise SystemExit('Settings diagnostic facts failed the data check')
                  print(text)
              print('::endgroup::')
              destination = cases[0].parent / 'hierarchy-export'
              subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(cases[0]),
                              '--output-path', str(destination),
                              '--test-id', 'UpgradeJourneyUITests/testInstalledAppJourney()',
                              '--filter', '*App UI hierarchy*'], check=True)
              attachments = sorted(destination.glob('*.txt'))
              if not attachments:
                  raise SystemExit('The failing point has no App UI hierarchy text attachment')
              records = json.loads((destination / 'manifest.json').read_text())
              names = {entry['exportedFileName']: entry.get('suggestedHumanReadableName', entry['exportedFileName'])
                       for record in records for entry in record['attachments']}
              for attachment in attachments:
                  text = settings_subtree(attachment.read_text())
                  category = rejection_category(text)
                  if category:
                      print('Rejected Settings subtree: file=' + attachment.name + '; category=' + category)
                      print('Data-check pattern: ' + forbidden.pattern.decode())
                      raise SystemExit('Settings subtree failed the data check')
                  print('::group::Backup preparation Settings subtree (' + names[attachment.name] + ')')
                  print(text)
                  print('::endgroup::')


          if __name__ == '__main__':
              main()
          PYTHON

      - name: Retain the single runner system-dialog crop
        if: always() && github.ref == 'refs/heads/work/upgrade-macos-metal-hosted' && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-system-dialog
          path: ~/Developer/xcode/EncryptedMemories/UpgradeCheck/evidence/system-dialog.png
          retention-days: 3
          if-no-files-found: error
