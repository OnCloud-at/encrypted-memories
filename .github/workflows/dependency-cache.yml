name: Measure hosted macOS Metal devices

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Hosted runner label to measure.
        required: true
        type: choice
        options:
          - xcode-27
          - xcode-27-xlarge
        default: xcode-27

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  measure:
    name: Measure Metal on ${{ inputs.runner_label }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 3
    steps:
      - name: Record toolchain and operating system
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          uname -m

      - name: Enumerate Metal devices
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/metal-devices.swift" <<'SWIFT'
          import Foundation
          import Metal

          func describe(_ device: any MTLDevice) -> [String: Any] {
              [
                  "name": device.name,
                  "supportsFamilyMetal3": device.supportsFamily(.metal3),
                  "registryID": String(device.registryID),
                  "isLowPower": device.isLowPower,
                  "hasUnifiedMemory": device.hasUnifiedMemory,
              ]
          }

          var report: [String: Any] = [
              "allDevices": MTLCopyAllDevices().map(describe),
              "defaultDevice": NSNull(),
          ]
          if let device = MTLCreateSystemDefaultDevice() {
              report["defaultDevice"] = describe(device)
          }
          let data = try JSONSerialization.data(
              withJSONObject: report, options: [.prettyPrinted, .sortedKeys]
          )
          print(String(decoding: data, as: UTF8.self))
          SWIFT
          xcrun swift "$RUNNER_TEMP/metal-devices.swift"

      - name: Report display hardware
        if: always()
        run: system_profiler SPDisplaysDataType
