name: Apple TestFlight internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version already configured in App Store Connect
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: Optional build number. Leave empty for the repository counter.
        required: false
        type: string
      group_name:
        description: Internal TestFlight group. Leave empty if exactly one exists.
        required: false
        type: string
      confirm:
        description: Build, sign, and upload iOS and macOS from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apple-distribution
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
    steps:
      - name: Check out workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate scripts
        run: |
          set -euo pipefail
          ruby -c .github/scripts/app_store_connect.rb
          ruby .github/scripts/test_app_store_connect.rb
          bash -n \
            .github/scripts/install_apple_signing.sh \
            .github/scripts/archive_and_upload.sh \
            .github/scripts/cleanup_apple_signing.sh

      - name: Resolve version and build number
        id: release
        env:
          CONFIRMED: ${{ inputs.confirm }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_NUMBER_BASE: ${{ vars.APPLE_BUILD_NUMBER_BASE }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Select main when starting this workflow." >&2
            exit 1
          }
          [[ "$CONFIRMED" == "true" ]] || {
            echo "Confirm the TestFlight upload before starting the workflow." >&2
            exit 1
          }
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || {
            echo "Version must contain two or three numeric components." >&2
            exit 1
          }

          build_number="$REQUESTED_BUILD_NUMBER"
          if [[ -z "$build_number" ]]; then
            base="${BUILD_NUMBER_BASE:-713}"
            [[ "$base" =~ ^[0-9]+$ ]] || {
              echo "APPLE_BUILD_NUMBER_BASE must be an integer." >&2
              exit 1
            }
            build_number="$((base + GITHUB_RUN_NUMBER))"
          fi
          [[ "$build_number" =~ ^[1-9][0-9]{0,17}$ ]] || {
            echo "Build number must contain from 1 through 18 digits." >&2
            exit 1
          }

          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          {
            echo "## Internal TestFlight release"
            echo
            echo "- Version: $REQUESTED_VERSION"
            echo "- Build: $build_number"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  upload:
    name: Upload ${{ matrix.platform }}
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    environment: testflight-internal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            api_platform: IOS
            script_platform: ios
          - platform: macOS
            api_platform: MAC_OS
            script_platform: macos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/prepare-apple-build

      - name: Check for an existing upload
        id: build
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          ruby .github/scripts/app_store_connect.rb inspect-build \
            --platform "${{ matrix.api_platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Validate existing build state
        env:
          PROCESSING_STATE: ${{ steps.build.outputs.processing_state }}
        run: |
          case "$PROCESSING_STATE" in
            FAILED|INVALID)
              echo "Apple already rejected this build number. Start a new workflow run." >&2
              exit 1
              ;;
          esac

      - name: Install signing credentials
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_SIGNING_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}
        run: bash .github/scripts/install_apple_signing.sh

      - name: Archive and upload
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: bash .github/scripts/archive_and_upload.sh "${{ matrix.script_platform }}"

      - name: Remove signing credentials
        if: always()
        run: bash .github/scripts/cleanup_apple_signing.sh

      - name: Report build storage
        if: always()
        run: bash ./scripts/report-build-storage.sh

  distribute:
    name: Add to internal TestFlight
    needs: [prepare, upload]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: testflight-internal
    steps:
      - name: Check out workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Wait for Apple and distribute the builds
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          GROUP_NAME: ${{ inputs.group_name }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

          group=()
          [[ -z "$GROUP_NAME" ]] || group=(--group "$GROUP_NAME")
          ruby .github/scripts/app_store_connect.rb distribute-internal \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            "${group[@]}"
