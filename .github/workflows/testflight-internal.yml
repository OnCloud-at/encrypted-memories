name: Apple release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-distribution
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  prepare:
    name: Validate GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.revision.outputs.build_number }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      channel: ${{ steps.release.outputs.channel }}
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
      automation_sha: ${{ steps.automation.outputs.commit_sha }}
      notes_ios_de_base64: ${{ steps.release.outputs.notes_ios_de_base64 }}
      notes_ios_en_base64: ${{ steps.release.outputs.notes_ios_en_base64 }}
      notes_macos_de_base64: ${{ steps.release.outputs.notes_macos_de_base64 }}
      notes_macos_en_base64: ${{ steps.release.outputs.notes_macos_en_base64 }}
    steps:
      - name: Validate workflow source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run a manual Apple release retry from main." >&2
            exit 1
          fi

      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record trusted automation revision
        id: automation
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate scripts
        run: |
          set -euo pipefail
          ruby -c .github/scripts/app_store_connect.rb
          ruby .github/scripts/test_app_store_connect.rb
          ruby -c .github/scripts/release_contract.rb
          ruby .github/scripts/test_release_contract.rb
          ruby -c .github/scripts/release_build_number.rb
          ruby .github/scripts/test_release_build_number.rb
          bash -n .github/scripts/validate_apple_distribution.sh

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-$REQUESTED_TAG}"
          [[ -n "$tag" ]] || {
            echo "A published GitHub release tag is required." >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          ruby .github/scripts/release_contract.rb \
            "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/apple-release-notes"

      - name: Verify and record release commit
        id: revision
        env:
          AUTOMATION_SHA: ${{ steps.automation.outputs.commit_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$release_sha" "$AUTOMATION_SHA" || {
            echo "The release tag must point to a commit on main." >&2
            exit 1
          }
          echo "commit_sha=$release_sha" >> "$GITHUB_OUTPUT"
          ruby .github/scripts/release_build_number.rb "$release_sha"

      - name: Check out the exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

  in-app-purchase-preflight:
    name: Validate StoreKit sandbox metadata
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testflight-internal
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Validate App Store Connect products
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_connect.rb validate-sandbox-in-app-purchases
          ruby .github/scripts/app_store_connect.rb validate-build-number \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

  upload:
    name: Upload ${{ matrix.platform }}
    needs: [prepare, in-app-purchase-preflight]
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight-internal
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            api_platform: IOS
            script_platform: ios
            scheme: EncryptedMemoriesMobile
            sdk: iphoneos
            destination: generic/platform=iOS
            profile_platform: ios
            profile_name: Encrypted Memories iOS App Store
            profile_app_identifier_key: application-identifier
            profile_expected_platform: iOS
          - platform: macOS
            api_platform: MAC_OS
            script_platform: macos
            scheme: EncryptedMemories
            sdk: macosx
            destination: generic/platform=macOS
            profile_platform: macos
            profile_name: Encrypted Memories macOS App Store
            profile_app_identifier_key: com.apple.application-identifier
            profile_expected_platform: OSX
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out release revision
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_release_sha="$(git rev-parse HEAD)"
          [[ "$actual_release_sha" == "$EXPECTED_RELEASE_SHA" ]] || {
            echo "The checked-out source does not match the validated release commit." >&2
            exit 1
          }

      - name: Check for an existing upload
        id: build
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          ruby .github/scripts/app_store_connect.rb inspect-build \
            --platform "${{ matrix.api_platform }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

      - name: Validate existing build state
        env:
          PROCESSING_STATE: ${{ steps.build.outputs.processing_state }}
        run: |
          case "$PROCESSING_STATE" in
            FAILED|INVALID)
              echo "Apple already rejected this build number. Start a new workflow run." >&2
              exit 1
              ;;
          esac

      - name: Decode Apple distribution certificate archive
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_SIGNING_CERTIFICATES_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12_BASE64 }}
        run: |
          set -euo pipefail
          certificate_archive="$RUNNER_TEMP/apple-signing-certificates.p12"
          ruby -rbase64 -e '
            File.binwrite(
              ARGV.fetch(0),
              Base64.strict_decode64(ENV.fetch("APPLE_SIGNING_CERTIFICATES_P12_BASE64"))
            )
          ' "$certificate_archive"
          chmod 600 "$certificate_archive"

      - name: Import certificates with pinned community action
        if: steps.build.outputs.exists != 'true'
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          keychain: encrypted_memories_signing
          p12-filepath: ${{ runner.temp }}/apple-signing-certificates.p12
          p12-password: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}

      - name: Resolve imported signing identities
        id: signing-identities
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          SCRIPT_PLATFORM: ${{ matrix.script_platform }}
        run: |
          set -euo pipefail
          identities_path="$RUNNER_TEMP/signing-identities.txt"
          security find-identity -v encrypted_memories_signing.keychain > "$identities_path"
          ruby - "$identities_path" <<'RUBY'
          path = ARGV.fetch(0)
          team_id = ENV.fetch("APPLE_DEVELOPER_TEAM_ID")
          platform = ENV.fetch("SCRIPT_PLATFORM")
          identities = []

          File.foreach(path) do |line|
            match = line.match(/^\s*\d+\)\s+([0-9A-F]{40})\s+"([^"]+)"\s*$/)
            identities << [match[1], match[2]] if match
          end
          identities.uniq!

          team_suffix = "(#{team_id})"
          distribution = identities.filter_map do |fingerprint, name|
            fingerprint if name.start_with?("Apple Distribution:") && name.end_with?(team_suffix)
          end.uniq
          installer = identities.filter_map do |fingerprint, name|
            legacy = name.start_with?("3rd Party Mac Developer Installer:")
            current = name.start_with?("Mac Installer Distribution:")
            fingerprint if (legacy || current) && name.end_with?(team_suffix)
          end.uniq

          abort "Expected one Apple Distribution identity, found #{distribution.length}." unless distribution.one?
          if platform == "macos" && !installer.one?
            abort "Expected one Mac App Store installer identity, found #{installer.length}."
          end

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts("distribution_sha1=#{distribution.first}")
            output.puts("installer_sha1=#{installer.first}") if platform == "macos"
          end
          RUBY
          rm -f "$identities_path"
          echo "Validated the imported distribution identities."

      - name: Create or install App Store provisioning profile
        id: profile
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          PROFILE_APP_IDENTIFIER_KEY: ${{ matrix.profile_app_identifier_key }}
          PROFILE_EXPECTED_PLATFORM: ${{ matrix.profile_expected_platform }}
          PROFILE_NAME: ${{ matrix.profile_name }}
          PROFILE_PLATFORM: ${{ matrix.profile_platform }}
          FASTLANE_DISABLE_COLORS: "1"
          FASTLANE_HIDE_TIMESTAMP: "1"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_MIN_VERSION: "2.237.0"
          FASTLANE_MAX_VERSION: "3.0.0"
          SIGH_IGNORE_PROFILES_WITH_DIFFERENT_NAME: "true"
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/app-store-connect-api-key.json"
          profile_output="$RUNNER_TEMP/provisioning-profile"
          mkdir -p "$profile_output"
          ruby -rbase64 -rjson -ropenssl -e '
            key = Base64.strict_decode64(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY_BASE64"))
            OpenSSL::PKey.read(key)
            File.write(
              ARGV.fetch(0),
              JSON.generate(
                key_id: ENV.fetch("APP_STORE_CONNECT_KEY_ID"),
                issuer_id: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"),
                key: key,
                in_house: false
              )
            )
          ' "$api_key_path"
          chmod 600 "$api_key_path"

          actual_fastlane_version="$(
            fastlane --version 2>&1 \
              | awk '/^fastlane [0-9]+\./ { print $2 }' \
              | tail -1
          )"
          [[ -n "$actual_fastlane_version" ]] || {
            echo "Could not determine the installed fastlane version." >&2
            exit 69
          }
          ruby -rrubygems -e '
            version = Gem::Version.new(ARGV.fetch(0))
            requirement = Gem::Requirement.new(
              ">= #{ENV.fetch("FASTLANE_MIN_VERSION")}",
              "< #{ENV.fetch("FASTLANE_MAX_VERSION")}"
            )
            abort "Expected fastlane #{requirement}, found #{version}." unless requirement.satisfied_by?(version)
          ' "$actual_fastlane_version"
          echo "Using compatible fastlane $actual_fastlane_version."
          fastlane sigh \
            --api_key_path "$api_key_path" \
            --app_identifier at.oncloud.encryptedmemories \
            --force \
            --team_id "$APPLE_DEVELOPER_TEAM_ID" \
            --platform "$PROFILE_PLATFORM" \
            --provisioning_name "$PROFILE_NAME" \
            --output_path "$profile_output"

          shopt -s nullglob
          profiles=("$profile_output"/*)
          [[ "${#profiles[@]}" -eq 1 ]] || {
            echo "Expected one provisioning profile, found ${#profiles[@]}." >&2
            exit 65
          }
          profile_plist="$RUNNER_TEMP/provisioning-profile.plist"
          security cms -D -i "${profiles[0]}" > "$profile_plist"
          plutil -lint "$profile_plist"

          actual_name="$(plutil -extract Name raw -o - "$profile_plist")"
          actual_team="$(plutil -extract TeamIdentifier.0 raw -o - "$profile_plist")"
          actual_app_identifier="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:$PROFILE_APP_IDENTIFIER_KEY" \
              "$profile_plist"
          )"
          expiration="$(plutil -extract ExpirationDate raw -o - "$profile_plist")"
          xcode_managed="$(plutil -extract IsXcodeManaged raw -o - "$profile_plist" 2>/dev/null || true)"
          platforms="$(plutil -extract Platform json -o - "$profile_plist")"

          [[ "$actual_name" == "$PROFILE_NAME" ]]
          [[ "$actual_team" == "$APPLE_DEVELOPER_TEAM_ID" ]]
          [[ "$actual_app_identifier" == "$APPLE_DEVELOPER_TEAM_ID.at.oncloud.encryptedmemories" ]]
          [[ "$xcode_managed" != "true" ]] || {
            echo "The provisioning profile is Xcode managed and cannot be used for manual signing." >&2
            exit 65
          }
          jq -e --arg platform "$PROFILE_EXPECTED_PLATFORM" \
            'index($platform) != null' <<< "$platforms" >/dev/null
          ruby -rtime -e \
            'exit(Time.parse(ARGV.fetch(0)) > Time.now + 86_400 ? 0 : 1)' \
            "$expiration"

          profile_certificate="$RUNNER_TEMP/provisioning-profile-certificate.der"
          profile_certificate_count=0
          profile_certificate_matches=0
          while profile_certificate_data="$(
            plutil -extract "DeveloperCertificates.$profile_certificate_count" \
              raw -o - "$profile_plist" 2>/dev/null
          )"; do
            printf '%s' "$profile_certificate_data" \
              | base64 --decode > "$profile_certificate"
            profile_certificate_sha1="$(
              openssl x509 -inform DER -in "$profile_certificate" -noout -fingerprint -sha1 \
                | awk -F= '{ print $2 }' \
                | tr -d ':'
            )"
            if [[ "$profile_certificate_sha1" == "$DISTRIBUTION_SHA1" ]]; then
              profile_certificate_matches="$((profile_certificate_matches + 1))"
            fi
            profile_certificate_count="$((profile_certificate_count + 1))"
          done
          [[ "$profile_certificate_count" -gt 0 ]] || {
            echo "The provisioning profile does not contain a distribution certificate." >&2
            exit 65
          }
          [[ "$profile_certificate_matches" -eq 1 ]] || {
            echo "The provisioning profile does not contain the imported distribution certificate." >&2
            exit 65
          }

          echo "name=$actual_name" >> "$GITHUB_OUTPUT"
          echo "Installed $actual_name, valid until $expiration."

      - uses: ./.github/actions/prepare-apple-build
        id: apple-build
        if: steps.build.outputs.exists != 'true'

      - name: Create manual export options
        id: export-options
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          INSTALLER_SHA1: ${{ steps.signing-identities.outputs.installer_sha1 }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions-${{ matrix.script_platform }}.plist"
          plutil -create xml1 "$options"
          plutil -insert destination -string export "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert provisioningProfiles -xml \
            "<dict><key>at.oncloud.encryptedmemories</key><string>$PROFILE_NAME</string></dict>" \
            "$options"
          plutil -insert signingCertificate -string "$DISTRIBUTION_SHA1" "$options"
          plutil -insert signingStyle -string manual "$options"
          plutil -insert stripSwiftSymbols -bool true "$options"
          plutil -insert teamID -string "$APPLE_DEVELOPER_TEAM_ID" "$options"
          plutil -insert uploadSymbols -bool true "$options"
          if [[ "${{ matrix.script_platform }}" == "macos" ]]; then
            plutil -insert installerSigningCertificate \
              -string "$INSTALLER_SHA1" \
              "$options"
          fi
          plutil -lint "$options"
          echo "path=$options" >> "$GITHUB_OUTPUT"

      - name: Archive with Xcode
        id: archive
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
          APPLE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          DISTRIBUTION_SHA1: ${{ steps.signing-identities.outputs.distribution_sha1 }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          SOURCE_PACKAGES_PATH: ${{ steps.apple-build.outputs.source-packages-path }}
          PACKAGE_CACHE_PATH: ${{ steps.apple-build.outputs.package-cache-path }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.xcarchive"
          derived_data="$RUNNER_TEMP/DerivedData-${{ matrix.script_platform }}.noindex"
          result_bundle="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.xcresult"
          log_path="$RUNNER_TEMP/EncryptedMemories-${{ matrix.script_platform }}.log"
          xcrun xcodebuild archive \
            -project EncryptedMemories.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data" \
            -resultBundlePath "$result_bundle" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -packageCachePath "$PACKAGE_CACHE_PATH" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPER_TEAM_ID" \
            MARKETING_VERSION="$APPLE_RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$APPLE_BUILD_NUMBER" \
            ENCRYPTED_MEMORIES_BUILD_COMMIT="${{ needs.prepare.outputs.commit_sha }}" \
            ENCRYPTED_MEMORIES_CODE_SIGN_STYLE=Manual \
            ENCRYPTED_MEMORIES_CODE_SIGN_IDENTITY="$DISTRIBUTION_SHA1" \
            ENCRYPTED_MEMORIES_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$log_path"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "log-path=$log_path" >> "$GITHUB_OUTPUT"

      - name: Export App Store package with Xcode
        id: export
        if: steps.build.outputs.exists != 'true'
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
          EXPORT_OPTIONS_PATH: ${{ steps.export-options.outputs.path }}
          ARCHIVE_LOG_PATH: ${{ steps.archive.outputs.log-path }}
        run: |
          set -euo pipefail
          export_path="$RUNNER_TEMP/export-${{ matrix.script_platform }}"
          xcrun xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            2>&1 | tee -a "$ARCHIVE_LOG_PATH"
          echo "path=$export_path" >> "$GITHUB_OUTPUT"

      - name: Validate signed archive and export
        id: artifact
        if: steps.build.outputs.exists != 'true'
        env:
          APPLE_DEVELOPER_TEAM_ID: ${{ vars.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          bash .github/scripts/validate_apple_distribution.sh \
            "${{ matrix.script_platform }}" \
            "${{ steps.archive.outputs.path }}" \
            "${{ steps.export.outputs.path }}" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.build_number }}" \
            "${{ steps.profile.outputs.name }}"

      - name: Upload package to App Store Connect
        if: steps.build.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail
          private_key_directory="$RUNNER_TEMP/app-store-connect-private-keys"
          private_key="$private_key_directory/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$private_key_directory"
          ruby -rbase64 -e '
            File.binwrite(
              ARGV.fetch(0),
              Base64.strict_decode64(ENV.fetch("APP_STORE_CONNECT_PRIVATE_KEY_BASE64"))
            )
          ' "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -noout
          xcrun altool --upload-package "$ARTIFACT_PATH" \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$private_key" \
            --show-progress \
            --output-format json

      - name: Remove temporary release credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apple-signing-certificates.p12"
          rm -f "$RUNNER_TEMP/app-store-connect-api-key.json"
          rm -rf "$RUNNER_TEMP/app-store-connect-private-keys"

      - name: Retain build diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testflight-${{ matrix.script_platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/EncryptedMemories-${{ matrix.script_platform }}.log
            ${{ runner.temp }}/EncryptedMemories-${{ matrix.script_platform }}.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Report build storage
        if: always()
        run: bash ./scripts/report-build-storage.sh

  distribute:
    name: Add to internal TestFlight
    needs: [prepare, upload]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: testflight-internal
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Restore localized Apple notes
        env:
          NOTES_IOS_DE_BASE64: ${{ needs.prepare.outputs.notes_ios_de_base64 }}
          NOTES_IOS_EN_BASE64: ${{ needs.prepare.outputs.notes_ios_en_base64 }}
          NOTES_MACOS_DE_BASE64: ${{ needs.prepare.outputs.notes_macos_de_base64 }}
          NOTES_MACOS_EN_BASE64: ${{ needs.prepare.outputs.notes_macos_en_base64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-release-notes"
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" NOTES_IOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" NOTES_IOS_EN_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" NOTES_MACOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" NOTES_MACOS_EN_BASE64

      - name: Wait for Apple and distribute the builds
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"

          ruby .github/scripts/app_store_connect.rb distribute-internal \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --localization "IOS:de-DE=$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" \
            --localization "IOS:en-US=$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" \
            --localization "MAC_OS:de-DE=$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" \
            --localization "MAC_OS:en-US=$RUNNER_TEMP/apple-release-notes/macos.en-US.txt"

  submit-app-store:
    name: Submit iOS and macOS to App Review
    needs: [prepare, upload]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: app-store-production
    steps:
      - name: Check out trusted release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.automation_sha }}
          persist-credentials: false

      - name: Restore localized Apple notes
        env:
          NOTES_IOS_DE_BASE64: ${{ needs.prepare.outputs.notes_ios_de_base64 }}
          NOTES_IOS_EN_BASE64: ${{ needs.prepare.outputs.notes_ios_en_base64 }}
          NOTES_MACOS_DE_BASE64: ${{ needs.prepare.outputs.notes_macos_de_base64 }}
          NOTES_MACOS_EN_BASE64: ${{ needs.prepare.outputs.notes_macos_en_base64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-release-notes"
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" NOTES_IOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" NOTES_IOS_EN_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" NOTES_MACOS_DE_BASE64
          ruby -rbase64 -e 'File.write(ARGV.fetch(0), Base64.strict_decode64(ENV.fetch(ARGV.fetch(1))))' \
            "$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" NOTES_MACOS_EN_BASE64

      - name: Wait for Apple and submit both platforms
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}"
          ruby .github/scripts/app_store_connect.rb prepare-app-store \
            --version "${{ needs.prepare.outputs.version }}" \
            --build-number "${{ needs.prepare.outputs.build_number }}" \
            --localization "IOS:de-DE=$RUNNER_TEMP/apple-release-notes/ios.de-DE.txt" \
            --localization "IOS:en-US=$RUNNER_TEMP/apple-release-notes/ios.en-US.txt" \
            --localization "MAC_OS:de-DE=$RUNNER_TEMP/apple-release-notes/macos.de-DE.txt" \
            --localization "MAC_OS:en-US=$RUNNER_TEMP/apple-release-notes/macos.en-US.txt" \
            --create-versions \
            --automatic-release \
            --submit
