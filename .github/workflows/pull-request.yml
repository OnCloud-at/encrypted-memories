name: Pull request verification

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      measure_cache:
        description: Measure populated dependency cache restores.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the merge queue for reduced pull request verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/require_merge_queue.py "$GITHUB_REPOSITORY"

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff-tree --check --root "$HEAD_SHA"
          fi

      - name: Scan the public tree for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
          # A pull request keeps every pushed commit, so each commit is scanned, not only the result.
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .
          fi

      - name: Enforce the public tree boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash scripts/check-public-tree.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Enforce public commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash scripts/check-commit-identities.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Test Apple release automation
        run: |
          set -euo pipefail
          ruby .github/scripts/test_pull_request_workflow.rb
          ruby -c .github/scripts/app_store_connect.rb
          ruby .github/scripts/test_app_store_connect.rb
          ruby -c .github/scripts/release_contract.rb
          ruby .github/scripts/test_release_contract.rb
          bash -n .github/scripts/validate_apple_distribution.sh
          bash -n .github/scripts/release_failure.sh
          bash .github/scripts/test_release_failure.sh
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].sort.each { |path| YAML.parse_file(path) }'

      - name: Test GitHub automation
        run: |
          set -euo pipefail
          python3 .github/scripts/test_require_merge_queue.py
          python3 .github/scripts/test_ios_test_commands.py
          python3 .github/scripts/test_remind_llm_key_expiry.py
          python3 .github/scripts/test_triage_issue.py
          python3 .github/scripts/test_review_pull_request.py
          python3 .github/scripts/test_review_advisory.py
          python3 .github/scripts/test_review_replay.py

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  package-verification:
    name: Package verification and style
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      style: ${{ steps.style.outcome }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-swiftlint
      - name: Select Xcode 27
        run: sudo xcode-select --switch /Applications/Xcode.app
      - name: Verify Swift style
        id: style
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            bash scripts/lint-swift.sh --diff "$BASE_SHA" "$HEAD_SHA"
          else
            bash scripts/lint-swift.sh --all
          fi
          bash scripts/check-swift-format.sh --all
      - uses: ./.github/actions/prepare-apple-build
        id: prepare
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          build-profile: package
          measure-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_cache }}
      - name: Run all package and SDK tests
        id: tests
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.prepare.outcome == 'success' }}
        run: bash ./scripts/verify-tests.sh
      - if: ${{ always() && github.event_name != 'pull_request' }}
        run: bash ./scripts/report-build-storage.sh

  ios-verification:
    name: iOS verification
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      architecture: ${{ steps.architecture.outcome }}
      shell: ${{ steps.shell.outcome }}
      tests: ${{ steps.tests.outcome }}
      ui: ${{ steps.ui.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
        id: prepare
        with:
          build-profile: app
          measure-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.measure_cache }}
      - name: Verify iOS shared architecture
        id: architecture
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash ./scripts/verify-universal-core.sh build-ios
      - name: Build the iOS app shell
        id: shell
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          SKIP_XCODEGEN: "1"
        run: DERIVED_DATA_PATH="$HOME/Developer/xcode/EncryptedMemories/core-gate-dd.noindex/iOS" bash ./scripts/verify-ios-app-shell.sh
      - name: Build the app and both simulator test bundles once
        id: test-build
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          IOS_TEST_ACTION: build-for-testing
          IOS_TEST_SCHEME: EncryptedMemoriesMobileCI
          IOS_TEST_PREPARED: "1"
        run: bash ./scripts/verify-ios-app-tests.sh
      - name: Run all hosted tests without building
        id: tests
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        env:
          IOS_TEST_ACTION: test-without-building
          IOS_TEST_SCHEME: EncryptedMemoriesMobileCI
          IOS_TEST_PREPARED: "1"
          IOS_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-hosted.xcresult
        run: bash ./scripts/verify-ios-app-tests.sh
      # One simulator: two clones on a hosted runner ran twice as long and timed out UI waits.
      - name: Run all UI tests without building
        id: ui
        if: ${{ !cancelled() && steps.test-build.outcome == 'success' }}
        env:
          IOS_TEST_ACTION: test-without-building
          IOS_TEST_SCHEME: EncryptedMemoriesMobileCI
          IOS_TEST_PREPARED: "1"
          IOS_TEST_RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-ui.xcresult
        run: bash ./scripts/verify-ios-app-tests.sh ui
      - name: Report simulator test counts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.ui.outcome == 'success' }}
        env:
          RESULT_ROOT: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for suite in hosted ui; do
            xcrun xcresulttool get test-results summary --path "$RESULT_ROOT/ios-$suite.xcresult" |
              python3 -c 'import json,sys; r=json.load(sys.stdin); print(sys.argv[1], {k:r[k] for k in ["totalTestCount", "passedTests", "failedTests", "skippedTests"]})' "$suite"
          done
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  macos-verification:
    name: macOS verification
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: xcode-27
    timeout-minutes: 60
    outputs:
      architecture: ${{ steps.architecture.outcome }}
      shell: ${{ steps.shell.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
        id: prepare
        with:
          build-profile: app
          save-cache: "false"
      - name: Verify macOS shared architecture
        id: architecture
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash ./scripts/verify-universal-core.sh build-macos
      - name: Build the macOS app shell
        id: shell
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          SKIP_XCODEGEN: "1"
        run: DERIVED_DATA_PATH="$HOME/Developer/xcode/EncryptedMemories/core-gate-dd.noindex/macOS" bash ./scripts/verify-macos-app-shell.sh
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  code-quality:
    name: Swift style
    needs: [package-verification]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Swift style
        env:
          RESULT: ${{ needs.package-verification.outputs.style }}
        run: test "$RESULT" = success

  package-tests:
    name: Swift package tests
    needs: [package-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all package and SDK tests
        env:
          RESULT: ${{ needs.package-verification.outputs.tests }}
        run: test "$RESULT" = success

  architecture:
    name: Shared architecture
    needs: [package-verification, ios-verification, macos-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require contracts and both platform builds
        env:
          PACKAGE_RESULT: ${{ needs.package-verification.outputs.tests }}
          IOS_RESULT: ${{ needs.ios-verification.outputs.architecture }}
          MACOS_RESULT: ${{ needs.macos-verification.outputs.architecture }}
        run: |
          set -euo pipefail
          test "$PACKAGE_RESULT" = success
          test "$IOS_RESULT" = success
          test "$MACOS_RESULT" = success

  ios-app-tests:
    name: iOS app tests
    needs: [ios-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require hosted tests
        env:
          RESULT: ${{ needs.ios-verification.outputs.tests }}
        run: test "$RESULT" = success

  ios-ui-tests:
    name: iOS UI tests
    needs: [ios-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require UI tests
        env:
          RESULT: ${{ needs.ios-verification.outputs.ui }}
        run: test "$RESULT" = success

  macos-app-shell:
    name: macOS app shell
    needs: [macos-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require macOS app shell
        env:
          RESULT: ${{ needs.macos-verification.outputs.shell }}
        run: test "$RESULT" = success

  ios-app-shell:
    name: iOS app shell
    needs: [ios-verification]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require iOS app shell
        env:
          RESULT: ${{ needs.ios-verification.outputs.shell }}
        run: test "$RESULT" = success
