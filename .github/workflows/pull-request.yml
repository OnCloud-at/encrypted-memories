name: Pull request verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff-tree --check --root "$HEAD_SHA"
          fi

      - name: Scan the public tree for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .

      - name: Enforce the public tree boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-public-tree.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Test Apple release automation
        run: |
          set -euo pipefail
          ruby -c .github/scripts/app_store_connect.rb
          ruby .github/scripts/test_app_store_connect.rb
          bash -n .github/scripts/validate_apple_distribution.sh
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].sort.each { |path| YAML.parse_file(path) }'

      - name: Test GitHub automation
        run: |
          set -euo pipefail
          python3 .github/scripts/test_remind_llm_key_expiry.py
          python3 .github/scripts/test_triage_issue.py
          python3 .github/scripts/test_review_pull_request.py

      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  code-quality:
    name: Swift style
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/install-swiftlint

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Lint changed Swift files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            bash scripts/lint-swift.sh --diff "$BASE_SHA" "$HEAD_SHA"
          else
            bash scripts/lint-swift.sh --all
          fi

      - name: Check Swift formatting
        run: bash scripts/check-swift-format.sh --all

  package-tests:
    name: Swift package tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
      - run: bash ./scripts/verify-tests.sh
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  ios-app-tests:
    name: iOS app tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
      - run: bash ./scripts/verify-ios-app-tests.sh
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  architecture-builds:
    name: Shared architecture (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: iOS
            mode: build-ios
          - platform: macOS
            mode: build-macos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
      - name: Verify ${{ matrix.platform }} shared architecture
        run: bash ./scripts/verify-universal-core.sh "${{ matrix.mode }}"
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  architecture:
    name: Shared architecture
    needs: [package-tests, architecture-builds]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require contracts and both platform builds
        env:
          PACKAGE_TESTS_RESULT: ${{ needs.package-tests.result }}
          ARCHITECTURE_BUILDS_RESULT: ${{ needs.architecture-builds.result }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGE_TESTS_RESULT" != "success" ]]; then
            echo "Swift package tests did not pass: $PACKAGE_TESTS_RESULT" >&2
            exit 1
          fi
          if [[ "$ARCHITECTURE_BUILDS_RESULT" != "success" ]]; then
            echo "One or more platform architecture builds did not pass: $ARCHITECTURE_BUILDS_RESULT" >&2
            exit 1
          fi

  macos-app-shell:
    name: macOS app shell
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
      - name: Build macOS app
        run: bash ./scripts/verify-macos-app-shell.sh
      - if: always()
        run: bash ./scripts/report-build-storage.sh

  ios-app-shell:
    name: iOS app shell
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-apple-build
      - name: Build iOS app
        run: bash ./scripts/verify-ios-app-shell.sh
      - if: always()
        run: bash ./scripts/report-build-storage.sh
