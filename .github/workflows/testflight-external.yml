name: Apple TestFlight external

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version of the processed build
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: Processed App Store Connect build number
        required: true
        type: string
      group_name:
        description: External group to create or update
        required: true
        default: External Testers
        type: string
      confirm:
        description: Submit both platform builds for external TestFlight testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apple-distribution
  cancel-in-progress: false

jobs:
  promote:
    name: Promote processed builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: testflight-external
    steps:
      - name: Validate request
        env:
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Select main when starting this workflow." >&2
            exit 1
          }
          [[ "$CONFIRMED" == "true" ]] || {
            echo "Confirm the external TestFlight submission." >&2
            exit 1
          }

      - name: Check out workflow code and metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Submit external TestFlight builds
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
          BETA_GROUP_NAME: ${{ inputs.group_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "Version must contain two or three numeric components." >&2
            exit 1
          }
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build number must be a positive integer." >&2
            exit 1
          }
          [[ "$BETA_GROUP_NAME" =~ ^[^[:cntrl:]]{1,100}$ ]] || {
            echo "Beta group name must contain 1 to 100 printable characters." >&2
            exit 1
          }
          ruby .github/scripts/test_app_store_connect.rb
          ruby .github/scripts/app_store_connect.rb wait-builds \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER"
          ruby .github/scripts/app_store_connect.rb distribute-external \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --group "$BETA_GROUP_NAME" \
            --localization en-US=TestFlight/WhatToTest.en-US.txt \
            --localization de-DE=TestFlight/WhatToTest.de-DE.txt
