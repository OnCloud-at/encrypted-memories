name: Apple App Store publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Approved iOS and macOS version awaiting manual release
        required: true
        default: "1.0.0"
        type: string
      confirm:
        description: Type PUBLISH to release both approved platforms
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apple-distribution
  cancel-in-progress: false

jobs:
  publish:
    name: Request App Store release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: app-store-production
    steps:
      - name: Validate request
        env:
          CONFIRMATION: ${{ inputs.confirm }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Select main when starting this workflow." >&2
            exit 1
          }
          [[ "$CONFIRMATION" == "PUBLISH" ]] || {
            echo "Type PUBLISH to confirm this production release." >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "Version must contain two or three numeric components." >&2
            exit 1
          }

      - name: Check out workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check for a previous release attempt
        id: release-lock
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          lock_ref="refs/release-locks/app-store-$RELEASE_VERSION"
          matches="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/release-locks/app-store-$RELEASE_VERSION" \
              --jq '.[].ref'
          )"
          if grep -Fxq "$lock_ref" <<< "$matches"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile a previous release attempt
        if: steps.release-lock.outputs.exists == 'true'
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ruby .github/scripts/test_app_store_connect.rb
          ruby .github/scripts/app_store_connect.rb verify-release-state \
            --version "$RELEASE_VERSION"

      - name: Create release lock
        if: steps.release-lock.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          lock_ref="refs/release-locks/app-store-$RELEASE_VERSION"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field ref="$lock_ref" \
            --raw-field sha="$GITHUB_SHA" \
            --silent
          created_ref="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/release-locks/app-store-$RELEASE_VERSION" \
              --jq '.ref'
          )"
          [[ "$created_ref" == "$lock_ref" ]] || {
            echo "GitHub did not persist the App Store release lock." >&2
            exit 1
          }

      - name: Release approved versions
        if: steps.release-lock.outputs.exists != 'true'
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ruby .github/scripts/test_app_store_connect.rb
          ruby .github/scripts/app_store_connect.rb release-app-store \
            --version "$RELEASE_VERSION"
