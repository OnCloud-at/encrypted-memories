name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/pages.yml
      - Branding/EncryptedMemories.svg
      - Branding/icon/icon_512.png
      - LICENSE
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Assemble static site
        run: |
          set -euo pipefail
          cmp LICENSE site/LICENSE.txt
          mkdir -p _site/assets
          cp -R site/. _site/
          cp Branding/icon/icon_512.png _site/assets/app-icon.png
          cp LICENSE _site/LICENSE.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
