name: ML model preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing prerelease tag beginning with ml-model-preview-"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH_PREVIEW to publish only to the preview channel"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash {0}

concurrency:
  group: ml-model-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Publish signed preview catalog pair
    runs-on: macos-26
    timeout-minutes: 60
    environment: ml-model-preview
    steps:
      - name: Check out preview release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - uses: ./.github/actions/prepare-apple-build

      - name: Resolve immutable prerelease candidate
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_TAG" == ml-model-preview-* ]] || {
            echo "Preview releases must use an ml-model-preview-* tag" >&2
            exit 1
          }
          [[ "$CONFIRMATION" == PUBLISH_PREVIEW ]] || {
            echo "Preview publication requires confirmation=PUBLISH_PREVIEW" >&2
            exit 1
          }

          release_json="$RUNNER_TEMP/github-preview-release.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$INPUT_TAG" \
            --output "$release_json"
          [[ "$(jq -r .draft "$release_json")" == false ]] || {
            echo "Draft releases cannot publish preview models" >&2
            exit 1
          }
          [[ "$(jq -r .prerelease "$release_json")" == true ]] || {
            echo "Preview publication requires a prerelease" >&2
            exit 1
          }
          asset_count=$(jq '[.assets[] | select(.name == "ml-release-candidate.tar.gz")] | length' "$release_json")
          [[ "$asset_count" == 1 ]] || {
            echo "Release must contain one ml-release-candidate.tar.gz asset" >&2
            exit 1
          }
          asset_id=$(jq -er '.assets[] | select(.name == "ml-release-candidate.tar.gz") | .id' "$release_json")
          asset_digest=$(jq -er '.assets[] | select(.name == "ml-release-candidate.tar.gz") | .digest' "$release_json")
          released_at=$(jq -er .published_at "$release_json")
          commit=$(git rev-list -n 1 "$INPUT_TAG")
          [[ "$commit" == "$(git rev-parse HEAD)" ]] || {
            echo "Checkout does not match the preview release tag" >&2
            exit 1
          }
          [[ "$asset_digest" == sha256:* ]] || {
            echo "GitHub did not provide a SHA-256 candidate digest" >&2
            exit 1
          }
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"
          echo "asset_sha256=${asset_digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "released_at=$released_at" >> "$GITHUB_OUTPUT"

      - name: Download and validate preview candidate
        env:
          ASSET_ID: ${{ steps.release.outputs.asset_id }}
          ASSET_SHA256: ${{ steps.release.outputs.asset_sha256 }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ml-release-preview-candidate.tar.gz"
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --output "$archive"
          echo "$ASSET_SHA256  $archive" | shasum --algorithm 256 --check
          python3 scripts/extract-ml-release-candidate.py "$archive" "$RUNNER_TEMP/candidate"
          candidate_commit=$(tr -d '\r\n' < "$RUNNER_TEMP/candidate/source-repository-revision.txt")
          [[ "$candidate_commit" == "$RELEASE_COMMIT" ]] || {
            echo "Candidate does not match the preview release tag commit" >&2
            exit 1
          }

      - name: Decode catalog signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ML_CATALOG_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$SIGNING_KEY_BASE64" ]] || { echo "Catalog signing key is unavailable" >&2; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/catalog-ed25519.key"
          [[ "$(stat -f %z "$RUNNER_TEMP/catalog-ed25519.key")" == 32 ]] || {
            echo "Catalog signing key must decode to 32 raw bytes" >&2
            exit 1
          }

      - name: Read the current preview catalog pair
        id: previous
        env:
          ML_MODEL_PREVIEW_BASE_URL: ${{ vars.ML_MODEL_PREVIEW_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - "$ML_MODEL_PREVIEW_BASE_URL" <<'PY'
          import sys
          import urllib.parse

          value = sys.argv[1]
          parsed = urllib.parse.urlsplit(value)
          if (
              parsed.scheme != "https"
              or not parsed.netloc
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
              or not parsed.path.endswith("/models/")
          ):
              raise SystemExit("ML_MODEL_PREVIEW_BASE_URL must be an HTTPS URL ending in /models/")
          PY
          [[ "$ML_MODEL_PREVIEW_BASE_URL" != "https://models.oncloud.at/models/" ]] || {
            echo "Preview publication cannot use the production model endpoint" >&2
            exit 1
          }

          catalog_root=${ML_MODEL_PREVIEW_BASE_URL%models/}
          previous="$RUNNER_TEMP/preview-previous"
          mkdir -p "$previous"
          cache_bust="read=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fetch() {
            local path=$1
            local output=$2
            local status
            if status=$(curl --silent --show-error --location --output "$output" \
                --write-out '%{http_code}' "$catalog_root$path?$cache_bust"); then
              printf '%s\n' "$status"
            else
              printf '000\n'
            fi
          }
          public_key='qXMyoYhp7TbPPXPAyEKDoy+kkl8He7I5RNXWgjNc5Kk='
          previous_args=()
          pointer_status=$(fetch active-pair.json "$previous/active-pair.json")

          if [[ "$pointer_status" == 200 ]]; then
            python3 scripts/verify-ml-release-pair.py --pointer "$previous/active-pair.json"
            xcrun swift scripts/verify-ml-catalog-signature.swift \
              --pointer "$previous/active-pair.json" "$public_key"
            current_pair=$(jq -er '.payload.pairID' "$previous/active-pair.json")
            for name in catalog-v1.json catalog-v1.sig catalog-v2.json catalog-v2.sig release-pair.json; do
              path=$(jq -er --arg name "$name" '.payload.objects[] | select(.name == $name) | .path' "$previous/active-pair.json")
              fetch "$path" "$previous/$name" | grep -qx '200' || {
                echo "Preview catalog object is unavailable: $path" >&2
                exit 1
              }
            done
            python3 scripts/verify-ml-release-pair.py "$previous" --expected-pair "$current_pair"
            xcrun swift scripts/verify-ml-catalog-signature.swift "$previous/catalog-v1.json" "$previous/catalog-v1.sig" "$public_key"
            xcrun swift scripts/verify-ml-catalog-signature.swift "$previous/catalog-v2.json" "$previous/catalog-v2.sig" "$public_key"
            pointer_sequence=$(jq -er '.payload.catalogSequence' "$previous/active-pair.json")
            catalog_sequence=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["catalogSequence"])' "$previous/catalog-v2.json")
            [[ "$pointer_sequence" == "$catalog_sequence" ]] || {
              echo "Preview pointer sequence does not match its catalog" >&2
              exit 1
            }
            sequence=$(python3 -c 'import sys; value=int(sys.argv[1]); assert 0 < value < 2**64-1; print(value + 1)' "$pointer_sequence")
            previous_args=(
              --previous-catalog-v1 "$previous/catalog-v1.json"
              --previous-signature-v1 "$previous/catalog-v1.sig"
              --previous-catalog-v2 "$previous/catalog-v2.json"
              --previous-signature-v2 "$previous/catalog-v2.sig"
            )
          elif [[ "$pointer_status" == 404 ]]; then
            v1_status=$(fetch catalog-v1.json "$previous/catalog-v1.json")
            v1_sig_status=$(fetch catalog-v1.sig "$previous/catalog-v1.sig")
            v2_status=$(fetch catalog-v2.json "$previous/catalog-v2.json")
            v2_sig_status=$(fetch catalog-v2.sig "$previous/catalog-v2.sig")
            if [[ "$v2_status" == 200 ]]; then
              [[ "$v1_status" == 200 && "$v1_sig_status" == 200 && "$v2_sig_status" == 200 ]] || {
                echo "Preview catalog pair is incomplete" >&2
                exit 1
              }
              xcrun swift scripts/verify-ml-catalog-signature.swift "$previous/catalog-v1.json" "$previous/catalog-v1.sig" "$public_key"
              xcrun swift scripts/verify-ml-catalog-signature.swift "$previous/catalog-v2.json" "$previous/catalog-v2.sig" "$public_key"
              sequence=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1]))["catalogSequence"]; assert isinstance(value,int) and 0 < value < 2**64-1; print(value + 1)' "$previous/catalog-v2.json")
              previous_args=(
                --previous-catalog-v1 "$previous/catalog-v1.json"
                --previous-signature-v1 "$previous/catalog-v1.sig"
                --previous-catalog-v2 "$previous/catalog-v2.json"
                --previous-signature-v2 "$previous/catalog-v2.sig"
              )
            elif [[ "$v1_status" == 200 && "$v1_sig_status" == 200 && "$v2_status" == 404 && "$v2_sig_status" == 404 ]]; then
              xcrun swift scripts/verify-ml-catalog-signature.swift "$previous/catalog-v1.json" "$previous/catalog-v1.sig" "$public_key"
              sequence=1
              previous_args=(
                --previous-catalog-v1 "$previous/catalog-v1.json"
                --previous-signature-v1 "$previous/catalog-v1.sig"
              )
            elif [[ "$v1_status" == 404 && "$v1_sig_status" == 404 && "$v2_status" == 404 && "$v2_sig_status" == 404 ]]; then
              sequence=1
            else
              echo "Preview catalog endpoints returned an inconsistent state" >&2
              exit 1
            fi
          else
            echo "Preview active pointer returned unexpected HTTP status: $pointer_status" >&2
            exit 1
          fi

          : > "$RUNNER_TEMP/preview-previous-arguments"
          if (( ${#previous_args[@]} > 0 )); then
            printf '%s\0' "${previous_args[@]}" > "$RUNNER_TEMP/preview-previous-arguments"
          fi
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"

      - name: Prepare and verify preview catalog pair
        id: prepared
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/candidate
          RELEASE_ROOT: ${{ runner.temp }}/preview-release
          ML_MODEL_PREVIEW_R2_BUCKET: ${{ vars.ML_MODEL_PREVIEW_R2_BUCKET }}
          ML_MODEL_PREVIEW_BASE_URL: ${{ vars.ML_MODEL_PREVIEW_BASE_URL }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASED_AT: ${{ steps.release.outputs.released_at }}
          CATALOG_SEQUENCE: ${{ steps.previous.outputs.sequence }}
        run: |
          set -euo pipefail
          [[ -n "$ML_MODEL_PREVIEW_R2_BUCKET" && -n "$ML_MODEL_PREVIEW_BASE_URL" ]] || {
            echo "Preview bucket and base URL are required" >&2
            exit 1
          }
          model_args=()
          for directory in "$CANDIDATE_ROOT"/models/*; do
            [[ -d "$directory" ]] || continue
            model_args+=(--model "$(basename "$directory")=$directory")
          done
          retirement_args=()
          retired_manifest="$CANDIDATE_ROOT/retired-models.json"
          if [[ -f "$retired_manifest" ]]; then
            retirement_args+=(--retired-models "$retired_manifest")
          fi
          (( ${#model_args[@]} > 0 || ${#retirement_args[@]} > 0 )) || {
            echo "Preview candidate contains no model updates or retirements" >&2
            exit 1
          }
          previous_args=()
          while IFS= read -r -d '' argument; do previous_args+=("$argument"); done < "$RUNNER_TEMP/preview-previous-arguments"

          xcrun swift scripts/prepare-ml-model-release.swift \
            --private-key "$RUNNER_TEMP/catalog-ed25519.key" \
            --output "$RELEASE_ROOT" \
            --bucket "$ML_MODEL_PREVIEW_R2_BUCKET" \
            --base-url "$ML_MODEL_PREVIEW_BASE_URL" \
            --candidate-root "$CANDIDATE_ROOT" \
            --evidence-dir "$CANDIDATE_ROOT/evidence" \
            --qualification-dir "$CANDIDATE_ROOT/qualification" \
            --notices-dir "$CANDIDATE_ROOT/notices" \
            --repository-revision "$RELEASE_COMMIT" \
            --released-at "$RELEASED_AT" \
            --catalog-sequence "$CATALOG_SEQUENCE" \
            --allow-empty-v1 \
            "${previous_args[@]}" \
            "${retirement_args[@]}" \
            "${model_args[@]}"

          public_key='qXMyoYhp7TbPPXPAyEKDoy+kkl8He7I5RNXWgjNc5Kk='
          xcrun swift scripts/verify-ml-catalog-signature.swift \
            --pointer "$RELEASE_ROOT/active-pair.json" "$public_key"
          xcrun swift scripts/verify-ml-catalog-signature.swift "$RELEASE_ROOT/catalog-v1.json" "$RELEASE_ROOT/catalog-v1.sig" "$public_key"
          xcrun swift scripts/verify-ml-catalog-signature.swift "$RELEASE_ROOT/catalog-v2.json" "$RELEASE_ROOT/catalog-v2.sig" "$public_key"
          zsh -n "$RELEASE_ROOT/publish-r2.sh"
          pair_id=$(tr -d '\r\n' < "$RELEASE_ROOT/release-pair.sha256")
          [[ ${#pair_id} == 64 && "$pair_id" != *[^0-9a-f]* ]] || { echo "Invalid preview catalog pair hash" >&2; exit 1; }
          python3 scripts/verify-ml-release-pair.py "$RELEASE_ROOT" --expected-pair "$pair_id"
          tar -C "$RELEASE_ROOT" -czf "$RUNNER_TEMP/ml-model-preview-$pair_id.tar.gz" .
          echo "pair_id=$pair_id" >> "$GITHUB_OUTPUT"

      - name: Retain signed preview evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ml-model-preview-${{ steps.prepared.outputs.pair_id }}
          path: ${{ runner.temp }}/ml-model-preview-${{ steps.prepared.outputs.pair_id }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview artifacts and activate the preview pair
        env:
          ML_MODEL_PREVIEW_R2_ENDPOINT: ${{ secrets.ML_MODEL_PREVIEW_R2_ENDPOINT }}
          ML_MODEL_PREVIEW_R2_ACCESS_KEY_ID: ${{ secrets.ML_MODEL_PREVIEW_R2_ACCESS_KEY_ID }}
          ML_MODEL_PREVIEW_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_MODEL_PREVIEW_R2_SECRET_ACCESS_KEY }}
          RELEASE_ROOT: ${{ runner.temp }}/preview-release
        run: |
          set -euo pipefail
          for name in ML_MODEL_PREVIEW_R2_ENDPOINT ML_MODEL_PREVIEW_R2_ACCESS_KEY_ID ML_MODEL_PREVIEW_R2_SECRET_ACCESS_KEY; do
            [[ -n "${!name}" ]] || { echo "$name is unavailable" >&2; exit 1; }
          done
          export R2_ENDPOINT="$ML_MODEL_PREVIEW_R2_ENDPOINT"
          export R2_ACCESS_KEY_ID="$ML_MODEL_PREVIEW_R2_ACCESS_KEY_ID"
          export R2_SECRET_ACCESS_KEY="$ML_MODEL_PREVIEW_R2_SECRET_ACCESS_KEY"
          "$RELEASE_ROOT/publish-r2.sh"

      - name: Verify public preview activation
        env:
          ML_MODEL_PREVIEW_BASE_URL: ${{ vars.ML_MODEL_PREVIEW_BASE_URL }}
          PAIR_ID: ${{ steps.prepared.outputs.pair_id }}
          CATALOG_SEQUENCE: ${{ steps.previous.outputs.sequence }}
          RELEASE_ROOT: ${{ runner.temp }}/preview-release
        run: |
          set -euo pipefail
          [[ "$ML_MODEL_PREVIEW_BASE_URL" != "https://models.oncloud.at/models/" ]] || {
            echo "Preview verification cannot use the production model endpoint" >&2
            exit 1
          }
          catalog_root=${ML_MODEL_PREVIEW_BASE_URL%models/}
          public="$RUNNER_TEMP/public-preview"
          mkdir -p "$public"
          verified=false
          for attempt in {1..12}; do
            if ! curl --fail --silent --show-error --location \
              "${catalog_root}active-pair.json?preview=${PAIR_ID}-${attempt}" \
              --output "$public/active-pair.json"; then
              sleep 10
              continue
            fi
            if ! python3 scripts/verify-ml-release-pair.py \
                --pointer "$public/active-pair.json" \
                --expected-pair "$PAIR_ID"; then
              sleep 10
              continue
            fi
            if ! xcrun swift scripts/verify-ml-catalog-signature.swift \
                --pointer "$public/active-pair.json" \
                qXMyoYhp7TbPPXPAyEKDoy+kkl8He7I5RNXWgjNc5Kk=; then
              sleep 10
              continue
            fi
            objects_ok=true
            for name in catalog-v1.json catalog-v1.sig catalog-v2.json catalog-v2.sig release-pair.json; do
              path=$(jq -er --arg name "$name" '.payload.objects[] | select(.name == $name) | .path' "$public/active-pair.json")
              if ! curl --fail --silent --show-error --location \
                  "$catalog_root$path?preview=$PAIR_ID-$attempt" \
                  --output "$public/$name"; then
                objects_ok=false
                break
              fi
            done
            if [[ "$objects_ok" != true ]]; then
              sleep 10
              continue
            fi
            if ! python3 scripts/verify-ml-release-pair.py "$public" --expected-pair "$PAIR_ID"; then
              sleep 10
              continue
            fi
            if cmp -s "$public/catalog-v1.json" "$RELEASE_ROOT/catalog-v1.json" \
              && cmp -s "$public/catalog-v1.sig" "$RELEASE_ROOT/catalog-v1.sig" \
              && cmp -s "$public/catalog-v2.json" "$RELEASE_ROOT/catalog-v2.json" \
              && cmp -s "$public/catalog-v2.sig" "$RELEASE_ROOT/catalog-v2.sig" \
              && cmp -s "$public/release-pair.json" "$RELEASE_ROOT/release-pair.json"; then
              legacy_ok=true
              for name in catalog-v1.json catalog-v1.sig catalog-v2.json catalog-v2.sig; do
                if ! curl --fail --silent --show-error --location \
                    "$catalog_root$name?preview-legacy=$PAIR_ID-$attempt" \
                    --output "$public/legacy-$name" \
                  || ! cmp -s "$public/legacy-$name" "$RELEASE_ROOT/$name"; then
                  legacy_ok=false
                  break
                fi
              done
              if [[ "$legacy_ok" == true ]]; then
                verified=true
                break
              fi
            fi
            sleep 10
          done
          [[ "$verified" == true ]] || { echo "Preview catalog pair did not converge" >&2; exit 1; }
          public_key='qXMyoYhp7TbPPXPAyEKDoy+kkl8He7I5RNXWgjNc5Kk='
          xcrun swift scripts/verify-ml-catalog-signature.swift "$public/catalog-v1.json" "$public/catalog-v1.sig" "$public_key"
          xcrun swift scripts/verify-ml-catalog-signature.swift "$public/catalog-v2.json" "$public/catalog-v2.sig" "$public_key"
          actual_pair=$(jq -er '.payload.pairID' "$public/active-pair.json")
          actual_sequence=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["catalogSequence"])' "$public/catalog-v2.json")
          [[ "$actual_pair" == "$PAIR_ID" && "$actual_sequence" == "$CATALOG_SEQUENCE" ]]

      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/catalog-ed25519.key"
