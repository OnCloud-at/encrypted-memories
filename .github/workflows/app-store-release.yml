name: Apple App Store submission

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing App Store version for iOS and macOS
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: Processed App Store Connect build number
        required: true
        type: string
      submit_for_review:
        description: Submit after attaching both builds, only after Apple approved the first consumable tips
        required: true
        default: false
        type: boolean
      confirm:
        description: Type RELEASE to change the production App Store version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-distribution
  cancel-in-progress: false

jobs:
  release:
    name: Prepare App Store submission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: app-store-production
    steps:
      - name: Validate request
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Select main when starting this workflow." >&2
            exit 1
          }
          [[ "$CONFIRMATION" == "RELEASE" ]] || {
            echo "Type RELEASE to confirm this production change." >&2
            exit 1
          }

      - name: Check out workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Attach builds and optionally submit App Review
        env:
          APP_STORE_CONNECT_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || {
            echo "Version must contain two or three numeric components." >&2
            exit 1
          }
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build number must be a positive integer." >&2
            exit 1
          }
          ruby .github/scripts/test_app_store_connect.rb
          submit=()
          [[ "$SUBMIT_FOR_REVIEW" != "true" ]] || submit=(--submit)
          ruby .github/scripts/app_store_connect.rb prepare-app-store \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            "${submit[@]}"
