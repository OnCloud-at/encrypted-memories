name: LLM API key expiry reminder

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: Europe/Vienna
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: llm-api-key-expiry-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: Check LLM API key expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted default-branch workflow code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create or update the expiry reminder
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY_EXPIRES_AT: ${{ vars.LLM_API_KEY_EXPIRES_AT }}
          LLM_KEY_REMINDER_ASSIGNEE: ${{ vars.LLM_KEY_REMINDER_ASSIGNEE }}
        run: python3 .github/scripts/remind_llm_key_expiry.py
