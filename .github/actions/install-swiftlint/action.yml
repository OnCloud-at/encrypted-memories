name: Install SwiftLint
description: Install the reviewed SwiftLint binary with checksum verification.

runs:
  using: composite
  steps:
    - name: Install SwiftLint 0.65.1
      shell: bash
      env:
        SWIFTLINT_VERSION: "0.65.1"
        SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/portable_swiftlint.zip"
        install_root="$RUNNER_TEMP/swiftlint-$SWIFTLINT_VERSION"
        curl --fail --location --silent --show-error \
          "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
          --output "$archive"
        echo "$SWIFTLINT_SHA256  $archive" | shasum --algorithm 256 --check
        mkdir -p "$install_root"
        ditto -x -k "$archive" "$install_root"
        [[ -x "$install_root/swiftlint" ]] || {
          echo "The SwiftLint executable is missing." >&2
          exit 1
        }
        echo "$install_root" >> "$GITHUB_PATH"
        "$install_root/swiftlint" version
