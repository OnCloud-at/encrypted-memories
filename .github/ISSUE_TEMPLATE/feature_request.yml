name: Feature request
description: Suggest an improvement for Encrypted Memories.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea. You can write in English or German.

        GitHub Issues are for concrete feature proposals, not setup or usage questions. Read the [Encrypted Memories Wiki](https://github.com/OnCloud-at/encrypted-memories/wiki) first.

        Before you continue, [search open and closed issues](https://github.com/OnCloud-at/encrypted-memories/issues?q=is%3Aissue) for the same need. Automated triage may send redacted excerpts from this public issue and selected public issues to the configured external HTTPS model endpoint. Never include personal, confidential, or sensitive data.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and did not find the same request.
          required: true
        - label: I removed personal, confidential, and sensitive data.
          required: true
        - label: I acknowledge that redacted excerpts from this public issue and selected public issues may be sent to the configured external HTTPS model endpoint for automatic triage.
          required: true
        - label: This is a concrete feature proposal, not a usage question.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the need before describing a solution.
      placeholder: I often need to… but currently…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the simplest useful outcome.
      placeholder: Encrypted Memories should…
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - All platforms
        - macOS
        - iPhone
        - iPad
        - Not platform-specific
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Optional. Explain how you handle this today or which alternatives you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add examples, sketches, or links that clarify the request. Do not include sensitive data.
