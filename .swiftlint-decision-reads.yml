# Decision reads (#1140, #1148): a read whose answer changes what the app writes, deletes, uploads, retries or shows
# as a result must not turn a failed read into absence. `scripts/lint-swift.sh` runs these rules in a second pass and
# allows only the sites that `.swiftlint-decision-reads-baseline` lists for a file and rule.
#
# Scope: the two store-read rules check every core module source below `Packages/EncryptedMemoriesKit/Sources/`. They
# skip the app hosts (`App/`, `iOSApp/`), tests and their doubles, and the frozen upgrade-test payloads below
# `scripts/upgrade-test/`. The exception is `no_try_optional_in_store_lookup`: it checks every linted file, hosts,
# tests and payloads included.
#
# Host decision gate (#1157): the two host rules check only the files below `App/` and `iOSApp/` of the checkout
# (`HOST_ROOT` below is the root of the checkout; `scripts/lint-swift.sh` fills it in). A host draws and starts native
# things; it does not decide from an error type or from the health of a store. The core decides and the host asks it
# (for example `TimelineRefreshFailurePolicy`). The tokens that a host may not use:
# - a cast to T: `x as T`, `x as? T`, `x as! T`, `x is T`, also inside a pattern (`catch let e as T`, `catch is T`,
#   `case let e as T`, `case .failure(let e as T)`, `case let .failure(e as T)`);
# - a pattern that names T: `catch T.case`, `if case T.case = error`, `guard case T.case = error`, `case T.case:`
#   and `case .failure(T.case)`, also `case let T.case(value)`;
#   T ends in Error or Failure, also with a module path (`Module.Sub.T`), `any T` or `(any T)`;
# - `switch` over a value whose name ends in err, error or failure, also `switch error.code` and `switch (error as? X)`;
# - `.isOperational()` and `.isReadable`, which ask a store whether it works.
# `CancellationError`, `URLError`, `NSError`, `CocoaError`, `DecodingError`, `EncodingError` and `LocalizedError` are
# platform types and stay allowed in every one of these forms, also with a module path. The list is closed: any other
# Apple error type (`POSIXError`, `PHPhotosError`, `CKError`, `NWError`) counts as T until it joins the list. A `//`
# that follows a colon (a web address) does not start a comment.
# The tokens are all the gate sees. What it does not see:
# - a decision on a core failure value, for example `failure.isRetryable` at `iOSApp/MobilePhotoViewer.swift:1993`;
# - another method name for a store health check, and an error type whose name does not end in Error or Failure;
# - a pattern without a type name: `catch .quotaExceeded`, `case .failure(.quotaExceeded)` and
#   `if case .quotaExceeded = error`;
# - a comparison with a case: `error == T.case`, `error != T.case`, `error ~= T.case`, and a metatype check such as
#   `type(of: error) == T.self`;
# - a pattern that names T below a second payload (`case .a(.b(T.case))`), or after a comma in one `case` or one
#   `catch` (`catch URLError.timedOut, AlbumError.x`);
# - a cast to a collection of T (`as? [T]`, `as? Array<T>`);
# - a declaration that stores T (`case failed(AlbumError)` in an enum): only a pattern or a cast reads the type;
# - a site after `//` inside a string, and a token inside a string or a `/* … */` comment (reported, as for the
#   store-read rules below);
# - a file outside `App/` and `iOSApp/`.
# The baseline lists the sites that exist and can only shrink; `scripts/decision-read-canary/HostForbidden.swift.txt`
# shows each token. `--diff` lints only the changed files, so a widened regex does not check an unchanged file until
# that file changes; the full lint (`--all`) checks every file.
#
# A regex cannot see types, so the store-read rules name what a store read looks like:
# - a receiver whose name is, or ends in, queue, store, catalog, journal, repository, manifest or ledger (camel case,
#   for example `queueStore`; `restore` is no receiver), reached through any `a.b?.c` chain, also across lines;
# - or no receiver (`entry(for:)` inside a store type, or after `self.`);
# - one of these read methods: entry, entries, decision…, containsAny, count, problemEntries, runnableDate, summary,
#   earliest…, nextRunnable…, runtimeIssue, present…, sourceState(s), handoff(s), read, readOutcome, readAllOutcome,
#   load, rows.
# A display read uses a `display…` name, which no rule matches. A declaration whose type is StoreLookup is no
# StoreLookup closure: a function result `-> StoreLookup<…> {`, a property `var name: StoreLookup<…> {` or `let`, and
# `extension StoreLookup {`.
#
# What a regex cannot see, so these forms are not reported:
# - a store read through another receiver name or a stored closure, and a read whose result reaches `try?` or `??`
#   through a local variable;
# - arguments with more than two levels of nested parentheses;
# - a `try?` more than two closures or blocks deep inside StoreLookup, and a `try?` that follows a closure with three
#   nested levels at the top of the StoreLookup closure, or with two nested levels inside a nested closure;
# - a site after `//` on the same line, also when the `//` sits in a string; a `{` or `}` in a string inside StoreLookup.
# `scripts/decision-read-canary/Allowed.swift.txt` shows each gap. Code in a string literal or a `/* … */` comment is
# reported: the rules check no syntax kinds, because SwiftLint checks them over the whole match, so a string or
# comment inside a matched range would hide a site.
#
# Decision protocols (#1148): decision code receives a decision store only through its protocol, so the compiler
# offers it only what the protocol declares. The decision stores are the backup queue, the photo library catalog, the
# pending backup store and the manual upload settlement. `decision_code_receives_store_protocol` checks every core
# module source and reports a concrete store type that a declaration names: a stored property, a parameter, a
# function result, a cast (`as`, `as?`, `as!`, `is`), a generic argument, a collection element, a tuple element or a
# closure parameter, also behind `any`, `some`, `inout`, `Optional<` or a module name (`UploadCore.Store`), and also
# after a comma. A metatype (`Store.self`) in these places is reported too. The stores' own files name their type
# only in their declaration and through `Self`, which the rule does not report. A constructor call (`Store(url:)`), a
# nested type or static member (`Store.StateUpdate`) and a `//` comment, also `///`, stay allowed; a `/* … */` comment
# is reported. The pattern names the four types twice, in the match and in its lookbehinds: a renamed store must be
# renamed there, and the canary fails until it is.
# The rule does not see a type alias of a concrete store, a same-type requirement (`where Wrapped == Store`), a type
# that a closure or a local variable infers, a store passed as `Any`, a metatype after `=`, or a declaration after a
# `//` inside a string earlier on the same line.
# The baseline lists the sites that exist and can only shrink. A queue, catalog or settlement site moves to the
# protocol of its store. The pending backup store has no decision protocol yet (#1154): its sites stay until it has
# one, and the rule keeps new ones out. Sites that create, own or test a store stay as exceptions that the baseline
# names.
#
# Each rule starts at fixed text (`StoreLookup`, `try?`, a read method) and checks what precedes it with bounded
# lookbehinds; identifier runs are bounded to 64 characters. This keeps the pass linear. Each rule reports the
# position of `try?` or `??` (capture group 1).

only_rules:
  - custom_rules

custom_rules:
  no_try_optional_in_store_lookup:
    name: Strict read in StoreLookup
    regex: 'StoreLookup(?<!//[^\n]{0,300}StoreLookup)(?<!->\s{0,9}StoreLookup)(?<!\bextension\s{1,9}StoreLookup)(?<!\b(?:var|let)\s{1,9}\w{1,64}\s{0,9}:\s{0,9}StoreLookup)(?:<(?:[^<>]|<[^<>]*>)*>)?\s*(?:\(\s*catching:\s*)?\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?(?:\{(?:[^{}]|\{[^{}]*\})*?(?:\{[^{}]*?)?)?(try\?)'
    capture_group: 1
    message: "Put the throwing read itself into StoreLookup(catching:); try? turns a failed read into absent."
    severity: error
  no_try_optional_store_read_in_decision_code:
    name: Strict store read in decision code
    included: &core_sources 'Packages/EncryptedMemoriesKit/Sources/'
    regex: '(try\?)(?<!//[^\n]{0,300}try\?)\s*(?:await\s+)?(?:(?:\b\w{1,64}\??\s*\.\s*)*(?:\b\w{0,64}[a-z0-9](?:Queue|Store|Catalog|Journal|Repository|Manifest|Ledger)|\b(?:queue|store|catalog|journal|repository|manifest|ledger))\b\??\s*\.\s*|(?:self\s*\.\s*)?)(?:entry|entries|decision[A-Z]\w{0,64}|containsAny|count|problemEntries|runnableDate|summary|earliest[A-Z]\w{0,64}|nextRunnable[A-Z]\w{0,64}|runtimeIssue|present[A-Z]\w{0,64}|sourceStates?|handoffs?|read|readOutcome|readAllOutcome|load|rows)\s*\('
    capture_group: 1
    message: "A decision read must not drop its failure with try?; use StoreLookup or handle the error."
    severity: error
  no_default_for_store_read_in_decision_code:
    name: No default for a store read in decision code
    included: *core_sources
    regex: '\b(?:entry|entries|decision[A-Z]\w{0,64}|containsAny|count|problemEntries|runnableDate|summary|earliest[A-Z]\w{0,64}|nextRunnable[A-Z]\w{0,64}|runtimeIssue|present[A-Z]\w{0,64}|sourceStates?|handoffs?|read|readOutcome|readAllOutcome|load|rows)(?<!//[^\n]{0,400})(?:(?<=(?:\b\w{0,64}[a-z0-9](?:Queue|Store|Catalog|Journal|Repository|Manifest|Ledger)|\b(?:queue|store|catalog|journal|repository|manifest|ledger))\??\s{0,40}\.\s{0,40}\w{1,64})|(?<!\.\s{0,40}\w{1,64})|(?<=\bself\s{0,40}\.\s{0,40}\w{1,64}))\s*\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\)(?:\s*\??\s*\.\s*\b\w{1,64}(?:\s*\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))?)*\s*(\?\?)'
    capture_group: 1
    message: "A decision read must not replace a failed read with a default; use StoreLookup or handle the nil."
    severity: error
  decision_code_receives_store_protocol:
    name: Store protocol in decision code
    included: *core_sources
    regex: '\b(UploadBackupSyncQueueManifestStore|PhotoLibraryCatalogManifestStore|PendingBackupManifestStore|UploadManualSettlementStore)\b(?<!//[^\n]{0,300}(?:UploadBackupSyncQueueManifestStore|PhotoLibraryCatalogManifestStore|PendingBackupManifestStore|UploadManualSettlementStore))(?<=(?::|->|\bas[?!]?|\bis|<|\[|\(|,)\s{0,40}(?:(?:any|some|inout)\s{1,9})?(?:(?:\[|\(|Optional<)\s{0,9}){0,3}(?:\w{1,64}\.)?(?:UploadBackupSyncQueueManifestStore|PhotoLibraryCatalogManifestStore|PendingBackupManifestStore|UploadManualSettlementStore))(?!\s*(?:\(|\.(?!\s*self\b)))'
    capture_group: 1
    message: "Decision code receives a decision store through its protocol, never through the concrete store type."
    severity: error
  no_domain_error_decision_in_host:
    name: Host decision from an error type
    included: &host_sources '^HOST_ROOT/(?:App|iOSApp)/'
    regex: '(?:\bas(?:[?!]\s*|\s+)|\bis\s+|\b(?:catch|case)\s+(?:let\s+)?(?:\.\s*\w{1,64}\s*\(\s*)?)(?<!(?:^|[^:])//[^\n]{0,300})(?:\(\s*)?(?:any\s+)?(?:\w{1,64}\.){0,8}(?!(?:CancellationError|URLError|NSError|LocalizedError|CocoaError|DecodingError|EncodingError)\b)[A-Z]\w{0,64}(?:Error|Failure)\b|\bswitch\s+(?<!(?:^|[^:])//[^\n]{0,300})\(?\s*[\w.?!]{0,100}?(?:[eE]rr(?:or)?|[fF]ailure)\b'
    message: "A host does not decide from an error type; ask the core, which returns what the host draws."
    severity: error
  no_store_health_check_in_host:
    name: Host decision from a store check
    included: *host_sources
    regex: '\.(?<!(?:^|[^:])//[^\n]{0,300})\s*(?:isOperational\s*\(|isReadable\b)'
    message: "A host does not ask a store whether it works; ask the core, which returns what the host draws."
    severity: error
